<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../../static/css/register.css">
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="sign-up-container mt-5">
            <div class="sign-up-heading pb-2 mb-3">
                <p class="text-center pt-2 fs-5 fw-medium">Create an Account</p>
            </div>
            <div class="sign-up-form ps-3 pe-3">
                <form action="">
                    <div class="input-group flex-nowrap mb-3">
                        <span class="input-group-text fa fa-user pt-2" id="addon-wrapping"></span>
                        <input type="text" class="form-control" placeholder="Username" aria-label="Username"
                            aria-describedby="addon-wrapping">
                    </div>

                    <div class="input-group flex-nowrap mb-3">
                        <span class="input-group-text fa fa-envelope pt-2" id="addon-wrapping"></span>
                        <input type="email" class="form-control" placeholder="Email" aria-label="Email"
                            aria-describedby="addon-wrapping">
                    </div>

                    <div class="input-group flex-nowrap mb-3">
                        <span class="input-group-text fa fa-phone pt-2" id="addon-wrapping"></span>
                        <input type="text" class="form-control" placeholder="Mobile" aria-label="Mobile"
                            aria-describedby="addon-wrapping">
                    </div>
                    <div class="input-group flex-nowrap mb-3">
                        <span class="input-group-text fa fa-lock pt-2" id="addon-wrapping"></span>
                        <input type="text" class="form-control" placeholder="Password" aria-label="Password"
                            aria-describedby="addon-wrapping">
                    </div>
                    <div class="input-group flex-nowrap mb-3">
                        <span class="input-group-text fa fa-lock pt-2" id="addon-wrapping"></span>
                        <input type="text" class="form-control" placeholder="Confirm Password"
                            aria-label="Confirm Password" aria-describedby="addon-wrapping">
                    </div>
                    <div class="text-center mb-2">
                        <button type="submit" class="btn btn-primary text-center text-black">Sign Up</button>
                    </div>
                </form>
                <div class="text-center">
                    <p>If You-re Already Registered ? <a class="text-decoration-none" href="">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
